name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Hisaab.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Hisaab.apk --target "${{ github.sha }}" \
            --title "Hisaab (latest build)" \
            --notes "Debug build. Open this page on your phone, download Hisaab.apk and install it."
