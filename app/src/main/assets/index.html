<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisaab</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#74746e;--ln:#e4e4de;--ac:#0f766e;--ac2:#e6f4f2;--red:#b42318;--grn:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f0f0ea;--mut:#9a9a92;--ln:#33332f;--ac:#2dd4bf;--ac2:#14302d;--red:#f87171;--grn:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f0f0ea;--mut:#9a9a92;--ln:#33332f;--ac:#2dd4bf;--ac2:#14302d;--red:#f87171;--grn:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
h1{font-size:22px;margin:0}
select{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px}
main{padding:8px 16px 150px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:17px}.sum span,.mut{color:var(--mut);font-size:13px}
.item{cursor:pointer}
.item .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:7px;background:var(--ln);border-radius:5px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:26px;font-weight:700}
.pos{color:var(--grn)}.neg{color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 2px;font:inherit;font-size:11.5px}
nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--bg);border:0;border-radius:28px;padding:14px 20px;font:inherit;font-weight:700;box-shadow:0 4px 14px #0004}
button.b{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.g{background:var(--ac2);color:var(--ac);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.d{background:none;color:var(--red);border:1px solid var(--red);border-radius:10px;padding:10px 14px;font:inherit}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
#m,#z{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.on,#z.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{margin:0 0 8px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
input{width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px}
#z{align-items:center}#z img{max-width:96%;max-height:90%;border-radius:8px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pay{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--ln);align-items:center;gap:8px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.x{background:none;border:0;color:var(--mut);font-size:18px}
.cs{max-width:46%;font-size:12px;padding:4px;margin-top:4px}
</style>
</head>
<body>
<header><h1>Hisaab</h1><select id="cur" onchange="S.cur=this.value;save();render()"><option>₹</option><option>$</option><option>€</option><option>£</option></select></header>
<main id="app"></main>
<button class="fab" id="fab" onclick="fabClick()"></button>
<nav><button data-t="month" onclick="go('month')">Month</button><button data-t="debt" onclick="go('debt')">Debt</button><button data-t="income" onclick="go('income')">Income</button><button data-t="invest" onclick="go('invest')">Invest</button><button data-t="spend" onclick="go('spend')">Spend</button></nav>
<div id="m"></div><div id="z" onclick="this.className=''"><img id="zi" alt=""></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let dsub='given',CU=null,CS=[],CN=[];
let S={cur:'₹',given:[],received:[],pay:[],inv:[],txn:[],up:{}},spM='',upM='',tab='month',view=null,tmp=[],okf=null,fk=[];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>S.cur+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const pad2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),today=()=>ymd(new Date());
const paid=d=>d.pay.reduce((a,p)=>a+p.amt,0);
const fdate=s=>!s?'No date':new Date(s+(s.length==7?'-01':'')+'T00:00').toLocaleDateString(undefined,s.length==7?{month:'short',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'});
const KIND={given:['Debt given','Lent to','Repaid to me','Still owed to me'],received:['Debt received','Borrowed from','Repaid by me','Still I owe']};

/* storage: IndexedDB, private to this browser */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('moneytracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function load(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(JSON.parse(JSON.stringify(S)),'s');syncReminders()}catch(e){console.error(e)}}

function go(t){tab=t;view=null;render()}
function fabClick(){if(tab=='income')addSlip();else if(tab=='invest')addInv();else if(tab=='spend')addTxn();else if(dsub=='shared')shareDebt();else addDebt(dsub)}
function thumbs(a){return a&&a.length?`<div class="thumbs">${a.map(s=>`<img src="${s}" alt="Screenshot" onclick="event.stopPropagation();zoom(this.src)">`).join('')}</div>`:''}
function zoom(s){$('#zi').src=s;$('#z').className='on'}
function twice(b,fn){if(b.dataset.s){fn()}else{b.dataset.s=1;b.dataset.t=b.textContent;b.textContent='Tap again to confirm';setTimeout(()=>{delete b.dataset.s;b.textContent=b.dataset.t},3000)}}

function render(){
  $('#cur').value=S.cur;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  $('#fab').style.display=view||tab=='month'?'none':'block';
  $('#fab').textContent=({debt:dsub=='shared'?'+ Share a debt':dsub=='given'?'+ Lend':'+ Borrow',income:'+ Payslip',invest:'+ Investment',spend:'+ Spending'})[tab];
  if(tab=='debt'&&dsub=='shared'&&!view&&!(CU&&CU.emailVerified))$('#fab').style.display='none';
  $('#app').innerHTML=view?detail():tab=='month'?month():tab=='income'?income():tab=='invest'?invest():tab=='spend'?spend():debtTab();
}

function emiInfo(d){const e=d.emi;if(!e)return null;const n=e.n>0?e.n:Math.max(1,Math.ceil(d.amt/e.amt-1e-9)),done=d.pay.filter(r=>r.emi).length,fin=done>=n;let next='';
  if(!fin){const b=new Date((e.start||d.date||today())+'T00:00'),dt=new Date(b.getFullYear(),b.getMonth()+done,1),dd=Math.min(b.getDate(),new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate());dt.setDate(dd);next=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
  return{e,n,done,fin,next,over:!!next&&next<today()}}
function emiLine(d){const i=emiInfo(d);if(!i)return '';return 'EMI '+money(i.e.amt)+' \u00b7 '+i.done+' of '+i.n+' paid'+(i.fin?' \u00b7 all paid':' \u00b7 next due '+fdate(i.next))}
function markEmi(k,id){const d=S[k].find(x=>x.id==id),i=emiInfo(d);modal('Mark EMI paid'+' ('+(i.done+1)+' of '+i.n+')',[{k:'amt',l:'Amount paid',t:'number',v:i.e.amt},{k:'date',l:'Paid on',t:'date',v:today()},{k:'note',l:'Note (optional)'}],(v,sh)=>{if(!(+v.amt>0))return false;d.pay.push({id:uid(),amt:+v.amt,date:v.date||today(),note:v.note,shots:sh,emi:true})})}
function setEmi(k,id){const d=S[k].find(x=>x.id==id),e=d.emi||{};modal(d.emi?'Edit EMI':'Set up EMI',[{k:'amt',l:'EMI amount (set 0 to remove EMI)',t:'number',v:e.amt||''},{k:'n',l:'Number of EMIs (blank = total ÷ EMI)',t:'number',v:e.n||''},{k:'start',l:'First EMI date',t:'date',v:e.start||d.date}],v=>{d.emi=+v.amt>0?{amt:+v.amt,n:+v.n||0,start:v.start||d.date}:null})}
function editDebt(k,id){const d=S[k].find(x=>x.id==id),e=d.emi||{};modal('Edit debt',[{k:'person',l:k=='given'?'Lent to':'Borrowed from',v:d.person},{k:'amt',l:'Amount',t:'number',v:d.amt},{k:'date',l:'Date (optional)',t:'date',v:d.date||''},{k:'phone',l:'Phone number for WhatsApp reminders (optional)',t:'tel',v:d.phone||''},{k:'due',l:'Due date (optional)',t:'date',v:d.due||''},{k:'note',l:'Note (optional)',v:d.note||''},{k:'emi',l:'EMI amount (optional, 0 removes EMI)',t:'number',v:e.amt||''},{k:'emin',l:'Number of EMIs (blank = total ÷ EMI)',t:'number',v:e.n||''},{k:'estart',l:'First EMI date (optional)',t:'date',v:e.start||''}],(v,sh)=>{if(!v.person||!(+v.amt>0))return false;d.person=v.person;d.amt=+v.amt;d.date=v.date||'';d.phone=v.phone;d.due=v.due||'';d.note=v.note;if(sh.length)d.shots=(d.shots||[]).concat(sh);d.emi=+v.emi>0?{amt:+v.emi,n:+v.emin||0,start:v.estart||d.date||today()}:null})}
function dueOf(d){const left=d.amt-paid(d);if(left<=0)return null;const i=emiInfo(d);if(i&&!i.fin)return{date:i.next,amt:Math.min(i.e.amt,left),emi:true};if(d.due)return{date:d.due,amt:left,emi:false};return null}
function addDays(t,n){const x=new Date(t+'T00:00');x.setDate(x.getDate()+n);return ymd(x)}
function waNum(p){let n=String(p||'').replace(/\D/g,'');if(n.length==10)n='91'+n;else if(n.length==11&&n[0]=='0')n='91'+n.slice(1);return n}
function waText(d){const du=dueOf(d),left=d.amt-paid(d);let t='Hi '+d.person+', a friendly reminder: '+money(left)+' is still pending'+(d.date?' (lent on '+fdate(d.date)+')':'')+'.';
  if(du)t+=' '+(du.emi?'The EMI of ':'The payment of ')+money(du.amt)+(du.date<today()?' was due on ':' is due on ')+fdate(du.date)+'.';
  return t+' Please let me know when you can pay. Thanks!'}
function openUrl(u){if(window.HisaabAndroid&&HisaabAndroid.openUrl)HisaabAndroid.openUrl(u);else window.open(u,'_blank')}
function remind(id){const d=S.given.find(x=>x.id==id);if(!d)return;const n=waNum(d.phone);openUrl('https://wa.me/'+n+'?text='+encodeURIComponent(waText(d)))}
function attnCard(){const lim=addDays(today(),3),o=[];['given','received'].forEach(k=>S[k].forEach(d=>{const du=dueOf(d);if(du&&du.date<=lim)o.push({k,d,du})}));if(!o.length)return '';o.sort((a,b)=>a.du.date.localeCompare(b.du.date));
  return `<div class="card"><b>Needs attention</b>${o.map(({k,d,du})=>{const ov=du.date<today();return `<div class="pay"><div onclick="dsub='${k}';view={k:'${k}',id:'${d.id}'};render()" style="cursor:pointer;min-width:0"><div><b>${esc(d.person)}</b> <span class="mut">${k=='given'?'owes you':'you owe'}</span></div><div class="mut" style="${ov?'color:var(--red)':''}">${du.emi?'EMI':'Due'} ${fdate(du.date)} \u00b7 ${money(du.amt)}${ov?' \u00b7 overdue':''}</div></div>${k=='given'?`<button class="g" onclick="remind('${d.id}')" aria-label="Remind on WhatsApp">\ud83d\udcac</button>`:''}</div>`}).join('')}</div>`}
function syncReminders(){try{if(!window.HisaabAndroid||!HisaabAndroid.setReminders)return;const out=[],now=Date.now();
  const add=(id,date,ttl,emi)=>{const when=new Date(date+'T09:00:00').getTime();[[when-864e5,'Due tomorrow'],[when,'Due today']].forEach(([t,lbl],i)=>{if(t>now)out.push({id:id+i,t,title:ttl,text:lbl+(emi?' \u00b7 EMI':'')})})};
  ['given','received'].forEach(k=>S[k].forEach(d=>{const du=dueOf(d);if(du)add(d.id,du.date,(k=='given'?d.person+' owes you ':'You owe '+d.person+' ')+money(du.amt),du.emi)}));
  (typeof sharedDue=='function'?sharedDue():[]).forEach(r=>add('sh'+r.id,r.date,r.ttl,false));
  HisaabAndroid.setReminders(JSON.stringify(out))}catch(e){}}
function debtTab(){
  const left=d=>Math.max(0,d.amt-paid(d)),tg=S.given.reduce((a,d)=>a+left(d),0),tr=S.received.reduce((a,d)=>a+left(d),0),net=tg-tr;
  let h=`<div class="card sum"><div><b class="pos">${money(tg)}</b><span>Owed to me</span></div><div><b class="neg">${money(tr)}</b><span>I owe</span></div><div><b class="${net>=0?'pos':'neg'}">${money(Math.abs(net))}</b><span>${net>=0?'Net owed to me':'Net I owe'}</span></div></div>`;
  h+=attnCard();
  h+=`<div class="row" style="margin:0 0 12px"><button class="${dsub=='given'?'b':'g'}" onclick="dsub='given';render()">Given</button><button class="${dsub=='received'?'b':'g'}" onclick="dsub='received';render()">Received</button><button class="${dsub=='shared'?'b':'g'}" onclick="dsub='shared';render()">Shared${typeof unreadN=='function'&&unreadN()?' ('+unreadN()+')':''}</button></div>`;
  if(dsub=='shared')return h+sharedTab();
  return h+list(dsub)}
function list(k){
  const L=S[k],tot=L.reduce((a,d)=>a+d.amt,0),pd=L.reduce((a,d)=>a+paid(d),0);
  let h=`<div class="card sum"><div><b>${money(tot)}</b><span>${KIND[k][1]}</span></div><div><b>${money(pd)}</b><span>${KIND[k][2]}</span></div><div><b class="${k=='given'?'pos':'neg'}">${money(tot-pd)}</b><span>${KIND[k][3]}</span></div></div>`;
  if(!L.length)return h+`<div class="empty">No entries yet.<br>Tap the button below to add one.</div>`;
  return h+L.map(d=>{const p=paid(d),pc=Math.min(100,p/d.amt*100),left=d.amt-p;
    return `<div class="card item" onclick="view={k:'${k}',id:'${d.id}'};render()"><div class="r"><b>${esc(d.person)}</b><b class="${left<=0?'pos':''}">${left<=0?'Settled':money(left)+' left'}</b></div><div class="bar"><i style="width:${pc}%"></i></div><div class="r mut"><span>${money(p)} of ${money(d.amt)}</span><span>${fdate(d.date)}</span></div>${d.emi?`<div class="mut" style="margin-top:4px;${emiInfo(d).over?'color:var(--red)':''}">${emiLine(d)}${emiInfo(d).over?' (overdue)':''}</div>`:(d.due&&d.amt-p>0?`<div class="mut" style="margin-top:4px;${d.due<today()?'color:var(--red)':''}">Due ${fdate(d.due)}${d.due<today()?' (overdue)':''}</div>`:'')}${thumbs(d.shots)}</div>`}).join('');
}

function detail(){
  if(view.k=='shared')return sharedDetail();
  const k=view.k,d=S[k].find(x=>x.id==view.id);if(!d){view=null;return debtTab()}
  const p=paid(d),left=d.amt-p,ei=emiInfo(d);
  return `<div class="top"><button class="g" onclick="view=null;render()">← Back</button></div>
  <div class="card"><div class="mut">${KIND[k][0]} · ${fdate(d.date)}</div><h2 style="margin:4px 0">${esc(d.person)}</h2>${d.note?`<div class="mut">${esc(d.note)}</div>`:''}
  <div class="bar"><i style="width:${Math.min(100,p/d.amt*100)}%"></i></div>
  <div class="sum" style="margin-top:10px"><div><b>${money(d.amt)}</b><span>Total</span></div><div><b>${money(p)}</b><span>Repaid</span></div><div><b class="${left<=0?'pos':'neg'}">${money(Math.max(left,0))}</b><span>Left</span></div></div>
  ${thumbs(d.shots)}
  ${ei?`<div style="margin-top:10px;${ei.over?'color:var(--red)':''}"><b>${emiLine(d)}</b>${ei.over?' (overdue)':''}</div>`:''}
  ${!ei&&d.due&&left>0?`<div style="margin-top:10px;${d.due<today()?'color:var(--red)':''}"><b>Due ${fdate(d.due)}</b>${d.due<today()?' (overdue)':''}</div>`:''}
  <div class="row"><button class="b" onclick="addPay('${k}','${d.id}')">+ Repayment</button>${ei&&!ei.fin?`<button class="b" onclick="markEmi('${k}','${d.id}')">\u2713 EMI paid</button>`:''}</div>
  ${k=='given'&&left>0?`<div class="row"><button class="${dueOf(d)&&dueOf(d).date<today()?'b':'g'}" onclick="remind('${d.id}')">\ud83d\udcac Remind on WhatsApp</button></div>`:''}
  <div class="row"><button class="g" onclick="editDebt('${k}','${d.id}')">\u270e Edit debt</button><button class="g" onclick="setEmi('${k}','${d.id}')">${ei?'Edit EMI':'Set up EMI'}</button></div></div>
  <div class="card"><b>Repayments</b>${d.pay.length?d.pay.map(r=>`<div class="pay"><div><b>${money(r.amt)}</b> <span class="mut">${fdate(r.date)}${r.emi?' · EMI':''}${r.note?' · '+esc(r.note):''}</span>${thumbs(r.shots)}</div><button class="x" onclick="delPay('${k}','${d.id}','${r.id}')" aria-label="Delete">✕</button></div>`).join(''):'<div class="mut" style="margin-top:6px">None recorded yet.</div>'}</div>
  <button class="d" style="width:100%" onclick="twice(this,()=>{S['${k}']=S['${k}'].filter(x=>x.id!='${d.id}');save();view=null;render()})">Delete this entry</button>`;
}

function salKw(){return (S.salKw==null?'amazon':S.salKw).trim()}
function bankSalary(){
 const k=salKw().toLowerCase(),c=k?S.txn.filter(x=>x.amt<0&&x.desc.toLowerCase().includes(k)&&!/refund|reversal|cashback|gift|\bpay\b.*(add|load)/i.test(x.desc)):[];
 const mx=Math.max(0,...c.map(x=>-x.amt)),by={};
 c.filter(x=>-x.amt>=mx*.2).forEach(x=>{const m=x.date.slice(0,7);by[m]=(by[m]||0)-x.amt});
 const ms=Object.keys(by).sort().reverse().slice(0,12);return{ms,by,n:ms.length,avg:ms.length?ms.reduce((a,m)=>a+by[m],0)/ms.length:0}}
function salCard(bs){return `<div class="card"><b>Salary found in bank statements</b><label>Employer name as it appears in your statement<input value="${esc(salKw())}" onchange="S.salKw=this.value.trim();save();render()"></label>${bs.n?bs.ms.map(m=>`<div class="pay"><span>${fdate(m)}</span><b>${money(bs.by[m])}</b></div>`).join(''):'<div class="mut" style="margin-top:8px">No matching credits yet. Import a bank statement on the Spend tab.</div>'}</div>`}
function income(){
  const ps=[...S.pay].sort((a,b)=>b.month.localeCompare(a.month));
  const rec=ps.slice(0,12),n=rec.length,g=rec.filter(x=>x.gross>0);
  const avgN=n?rec.reduce((a,x)=>a+x.net,0)/n:0,avgG=g.length?g.reduce((a,x)=>a+x.gross,0)/g.length:0;
  const bs=bankSalary(),useB=bs.n>0,estN=useB?bs.avg:avgN;
  let h=`<div class="card"><div class="mut">Estimated annual income (take-home)</div><div class="big">${money(estN*12)}</div>
  ${avgG?`<div class="mut" style="margin-top:4px">Gross: <b>${money(avgG*12)}</b> / year</div>`:''}
  <div class="mut" style="margin-top:8px">${useB?`Based on ${bs.n} month${bs.n>1?'s':''} of salary credits in your bank statements (${money(bs.avg)}/month) × 12`:n?`Average of your latest ${n} payslip${n>1?'s':''} (${money(avgN)}/month) × 12`:'Import a bank statement with your salary credits, or add payslips.'}</div></div>`;
  h+=salCard(bs);
  if(!ps.length)return h+`<div class="empty">No payslips added (optional).</div>`;

 return h+`<div class="card"><b>Transactions</b>${L.slice(0,300).map(x=>`<div class="pay"><div style="min-width:0">${(P=>`<div onclick="rename('${x.id}')" style="cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(P.name)}</b> <span class="mut">✎</span></div><div class="mut">${fdate(x.date)}${[...new Set([P.mode,x.card?'Card':'',P.ref?'Ref …'+P.ref.slice(-4):''])].filter(Boolean).map(t=>' · '+t).join('')}</div>${P.note?`<div class="mut" style="font-size:12px">${esc(P.note)}</div>`:''}`)(rideP(x))}<select class="cs" onchange="setCat('${x.id}',this.value)">${CATL.map(c=>`<option${c==x.cat?' selected':''}>${c}</option>`).join('')}</select></div><div style="text-align:right"><b class="${x.amt>0?'neg':'pos'}">${x.amt>0?'−':'+'}${money(Math.abs(x.amt))}</b><br><button class="x" onclick="delTxn('${x.id}')" aria-label="Delete">✕</button></div></div>`).join('')}</div>`;
}
function setCat(id,c){const x=S.txn.find(t=>t.id==id);x.cat=c;
 if(x.amt>0&&!x.ride&&!isRent(x)){const k=parseDesc(x.desc).key;S.alias=S.alias||{};S.alias[k]=Object.assign(S.alias[k]||{},{c});S.txn.forEach(t=>{if(t.amt>0&&!t.ride&&!isRent(t)&&parseDesc(t.desc).key==k)t.cat=c})}
 save();render()}
function delTxn(id){S.txn=S.txn.filter(x=>x.id!=id);save();render()}
function addTxn(){modal('Add spending',[{k:'date',l:'Date',t:'date',v:today()},{k:'desc',l:'Description'},{k:'amt',l:'Amount',t:'number'},{k:'cat',l:'Category',o:CATL.slice(0,-1)}],(v,sh)=>{if(!(+v.amt>0))return false;const d=v.date||today();S.txn.push({id:uid(),date:d,desc:v.desc,amt:+v.amt,cat:v.cat});spM=d.slice(0,7)})}
function importBank(c){impCard=!!c;pickFile((rows,fn)=>{
 if(rows.pdf)return bankPdf(rows,fn);
 const t=table(rows,['date','narration','description','particulars','withdrawal','debit','deposit','credit','amount']);
 if(!t)return toast('No transaction columns found. Expected Date, Narration, Debit/Withdrawal, Credit/Deposit.');
 const h=t.hd,iD=col(h,'txn date','transaction date','value date','date'),iS=col(h,'narration','description','particulars','remarks','details'),iW=col(h,'withdrawal','debit'),iR=col(h,'deposit','credit'),iA=col(h,'amount'),iT=col(h,'dr / cr','dr/cr','cr/dr','type');
 let n=0,dup=0;const seen=new Set(S.txn.map(x=>x.date+x.desc+x.amt));
 t.data.forEach(r=>{const date=pdate(r[iD]);if(!date)return;const desc=String(r[iS]||'').trim().replace(/\s+/g,' ');let amt;
  if(iW>=0&&iR>=0&&iW!=iR)amt=num(r[iW])-num(r[iR]);else if(iA>=0){const a=Math.abs(num(r[iA])),ty=iT>=0?String(r[iT]).trim():'';amt=ty?(/^c/i.test(ty)?-a:a):(impCard?(/cr\s*$/i.test(String(r[iA]).trim())?-a:num(r[iA])):-num(r[iA]))}else return;
  if(!amt)return;const k=date+desc+amt;if(seen.has(k)){dup++;return}seen.add(k);S.txn.push({id:uid(),date,desc,amt,cat:cardCat(amt,desc),card:impCard||undefined});n++});
 rec(impCard?'card':'bank',fn,n);save();render();toast(n+' transactions imported'+(dup?`, ${dup} duplicates skipped`:''))})}

render();
load().then(s=>{if(s)S=Object.assign(S,s);const gone=new Set(S.txn.filter(t=>t.cash).map(t=>t.id));S.txn=S.txn.filter(t=>!t.cash);(S.rides||[]).forEach(r=>{if(gone.has(r.tx))r.tx=''});syncReminders();matchRides();S.txn.forEach(x=>{if(x.amt>0&&/sanchu/i.test(x.desc)&&!((S.alias||{})[parseDesc(x.desc).key]||{}).c)x.cat='Pet expenses';if(x.amt>0&&(x.cat=='Cash & Transfers'||x.cat=='Other')&&/indian\s*clearing|\biccl\b|yesb0*709|nach0*22163\b/i.test(x.desc))x.cat='Investments';fixRent(x);if(x.amt>0&&(x.cat=='Cash & Transfers'||x.cat=='Other')&&/\beternal\b/i.test(x.desc)&&!((S.alias||{})[parseDesc(x.desc).key]||{}).c)x.cat='Food & Dining'});save();render()});
</script>

<script>
/* ---- Stage 2: accounts + shared debts (Firebase). Android app only. ---- */
const FB_CONFIG=null; /* paste your Firebase web config object here, see FIREBASE-SETUP.md */
let cloudReady=false,cloudMsg='',fbUnsubs=[];
const lc=e=>String(e||'').trim().toLowerCase();
const IS_APP=!!window.HisaabAndroid;
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(e)})}
async function cloudInit(){
  if(!FB_CONFIG||cloudReady)return cloudReady;
  try{const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
    await loadScript(b+'app-compat.js');await Promise.all([loadScript(b+'auth-compat.js'),loadScript(b+'firestore-compat.js')]);
    firebase.initializeApp(FB_CONFIG);
    firebase.firestore().settings({experimentalAutoDetectLongPolling:true,merge:true});
    firebase.auth().onAuthStateChanged(u=>{CU=u;watch();render()});
    cloudReady=true}catch(e){cloudMsg='Could not reach the sync service. Check your internet connection.'}
  return cloudReady}
function watch(){fbUnsubs.forEach(f=>f());fbUnsubs=[];CS=[];CN=[];
  if(!CU||!CU.emailVerified)return;
  const db=firebase.firestore(),me=lc(CU.email);
  fbUnsubs.push(db.collection('shared').where('emails','array-contains',me).onSnapshot(q=>{CS=q.docs.map(d=>({...d.data(),id:d.id}));syncReminders();overdueNotes();if(tab=='debt')render()},e=>{cloudMsg=e.message;render()}));
  fbUnsubs.push(db.collection('notes').where('to','==',me).onSnapshot(q=>{CN=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.ts-a.ts);if(tab=='debt')render()},()=>{}))}
const unreadN=()=>CN.filter(n=>!n.read).length;
const myName=()=>CU.displayName||CU.email.split('@')[0];
const sPaid=r=>(r.pay||[]).reduce((a,p)=>a+p.amt,0);
const imLender=r=>lc(CU.email)==r.lender;
const otherOf=r=>imLender(r)?{e:r.borrower,n:r.borrowerName}:{e:r.lender,n:r.lenderName};
const oName=r=>{const o=otherOf(r);return o.n||o.e};
function note(to,text,ref){return firebase.firestore().collection('notes').add({to,text,ts:Date.now(),read:false,ref:ref||''})}
function cerr(e){cloudMsg=(e&&e.message||'Something went wrong').replace('Firebase: ','');render()}
function sharedDue(){if(!CU||!CU.emailVerified)return [];return CS.filter(r=>r.status=='accepted'&&r.due&&r.amt-sPaid(r)>0).map(r=>({id:r.id,date:r.due,ttl:(imLender(r)?oName(r)+' owes you ':'You owe '+oName(r)+' ')+money(r.amt-sPaid(r))}))}
/* lender's app tells the borrower (in-app) once when a due date is missed */
function overdueNotes(){try{CS.forEach(r=>{if(r.status!='accepted'||!imLender(r)||!r.due||r.due>=today()||r.amt-sPaid(r)<=0)return;
  const k='od_'+r.id+'_'+r.due;if(localStorage.getItem(k))return;localStorage.setItem(k,1);
  note(r.borrower,(r.lenderName||r.lender)+': payment of '+money(r.amt-sPaid(r))+' was due on '+fdate(r.due),r.id)})}catch(e){}}

function sharedTab(){
  if(!IS_APP)return `<div class="card"><b>Shared debts</b><div class="mut" style="margin-top:6px">Accounts and shared debts work in the Hisaab Android app.</div></div>`;
  if(!FB_CONFIG)return `<div class="card"><b>Shared debts</b><div class="mut" style="margin-top:6px">The sync service isn't configured yet. See FIREBASE-SETUP.md in the repository.</div></div>`;
  if(!cloudReady){cloudInit().then(()=>render());return `<div class="empty">${esc(cloudMsg)||'Connecting…'}</div>`}
  const err=cloudMsg?`<div class="card" style="color:var(--red)">${esc(cloudMsg)}</div>`:'';
  if(!CU)return err+`<div class="card"><b>Sign in to share debts</b><div class="mut" style="margin:4px 0 6px">Share a debt with someone who also uses Hisaab. They get a request and the record is created once they accept.</div>
   <input id="cu_name" placeholder="Your name (for a new account)"><input id="cu_email" type="email" placeholder="Email" autocapitalize="none"><input id="cu_pass" type="password" placeholder="Password (6+ characters)">
   <div class="row"><button class="b" onclick="cSign(0)">Sign in</button><button class="g" onclick="cSign(1)">Create account</button></div>
   <div class="row"><button class="g" onclick="cReset()">Forgot password</button></div></div>`;
  if(!CU.emailVerified)return err+`<div class="card"><b>Verify your email</b><div class="mut" style="margin:6px 0">We sent a link to ${esc(CU.email)}. Open it, then tap the button below. This keeps people from claiming someone else's email.</div>
   <div class="row"><button class="b" onclick="CU.reload().then(()=>{cloudMsg='';watch();render()}).catch(cerr)">I've verified</button><button class="g" onclick="CU.sendEmailVerification().then(()=>{cloudMsg='Verification email sent again.';render()}).catch(cerr)">Resend</button></div>
   <div class="row"><button class="g" onclick="firebase.auth().signOut()">Sign out</button></div></div>`;
  const me=lc(CU.email),inc=CS.filter(r=>r.status=='pending'&&r.createdBy!=me),out=CS.filter(r=>r.status=='pending'&&r.createdBy==me),acc=CS.filter(r=>r.status=='accepted'),dec=CS.filter(r=>r.status=='declined');
  let h=err+`<div class="card"><div class="r" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="mut">Signed in as ${esc(CU.email)}</span><button class="g" onclick="firebase.auth().signOut()">Sign out</button></div></div>`;
  const un=CN.filter(n=>!n.read);
  if(CN.length)h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Notifications${un.length?' ('+un.length+')':''}</b>${un.length?`<button class="g" onclick="readNotes()">Mark read</button>`:''}</div>${CN.slice(0,8).map(n=>`<div class="pay"><div style="${n.read?'':'font-weight:600'}">${esc(n.text)}<div class="mut">${new Date(n.ts).toLocaleDateString()}</div></div></div>`).join('')}</div>`;
  if(inc.length)h+=`<div class="card"><b>Requests for you</b>${inc.map(r=>`<div class="pay"><div><b>${esc(oName(r))}</b> says ${imLender(r)?'they owe you':'you owe them'} <b>${money(r.amt)}</b>${r.due?'<div class="mut">Due '+fdate(r.due)+'</div>':''}${r.note?'<div class="mut">'+esc(r.note)+'</div>':''}</div><div style="display:flex;gap:6px"><button class="b" onclick="respond('${r.id}',1)">Accept</button><button class="g" onclick="respond('${r.id}',0)">Decline</button></div></div>`).join('')}</div>`;
  if(out.length)h+=`<div class="card"><b>Waiting for them</b>${out.map(r=>`<div class="pay"><div>${esc(oName(r))} · ${money(r.amt)}<div class="mut">${imLender(r)?'You lent':'You borrowed'} · pending</div></div><button class="x" onclick="twice(this,()=>cancelShared('${r.id}'))" aria-label="Cancel request">✕</button></div>`).join('')}</div>`;
  const tl=acc.filter(r=>imLender(r)).reduce((a,r)=>a+r.amt-sPaid(r),0),tb=acc.filter(r=>!imLender(r)).reduce((a,r)=>a+r.amt-sPaid(r),0);
  h+=`<div class="card sum"><div><b class="pos">${money(tl)}</b><span>Owed to me</span></div><div><b class="neg">${money(tb)}</b><span>I owe</span></div></div>`;
  if(!acc.length&&!inc.length&&!out.length)h+=`<div class="empty">No shared debts yet.<br>Tap the button below to share one.</div>`;
  h+=acc.sort((a,b)=>b.ts-a.ts).map(r=>{const p=sPaid(r),left=r.amt-p,ov=r.due&&r.due<today()&&left>0;return `<div class="card item" onclick="view={k:'shared',id:'${r.id}'};render()"><div class="r"><b>${esc(oName(r))}</b><b class="${left<=0?'pos':''}">${left<=0?'Settled':money(left)+' left'}</b></div><div class="bar"><i style="width:${Math.min(100,p/r.amt*100)}%"></i></div><div class="r mut"><span>${imLender(r)?'They owe you':'You owe them'}</span><span>${money(p)} of ${money(r.amt)}</span></div>${r.due&&left>0?`<div class="mut" style="margin-top:4px;${ov?'color:var(--red)':''}">Due ${fdate(r.due)}${ov?' (overdue)':''}</div>`:''}</div>`}).join('');
  if(dec.length)h+=`<div class="card"><b>Declined</b>${dec.map(r=>`<div class="pay"><div>${esc(oName(r))} · ${money(r.amt)}</div><button class="x" onclick="cancelShared('${r.id}')" aria-label="Remove">✕</button></div>`).join('')}</div>`;
  return h}
function sharedDetail(){const r=CS.find(x=>x.id==view.id);if(!r){view=null;return debtTab()}
  if(r.status=='accepted'&&(r.pay||[]).length)loadProofs(r.id);const pf=SP[r.id]||{};
  const p=sPaid(r),left=r.amt-p,me=lc(CU.email),L=imLender(r),ov=r.due&&r.due<today()&&left>0;
  return `<div class="top"><button class="g" onclick="view=null;render()">← Back</button></div>
  <div class="card"><div class="mut">${L?'Lent to':'Borrowed from'} · ${fdate(r.date)}</div><h2 style="margin:4px 0">${esc(oName(r))}</h2><div class="mut">${esc(otherOf(r).e)}</div>${r.note?`<div class="mut">${esc(r.note)}</div>`:''}
  <div class="bar"><i style="width:${Math.min(100,p/r.amt*100)}%"></i></div>
  <div class="sum" style="margin-top:10px"><div><b>${money(r.amt)}</b><span>Total</span></div><div><b>${money(p)}</b><span>Repaid</span></div><div><b class="${left<=0?'pos':'neg'}">${money(Math.max(left,0))}</b><span>Left</span></div></div>
  ${r.due&&left>0?`<div style="margin-top:10px;${ov?'color:var(--red)':''}"><b>Due ${fdate(r.due)}</b>${ov?' (overdue)':''}</div>`:''}
  ${r.status=='accepted'?`<div class="row"><button class="b" onclick="addSharedPay('${r.id}')">+ Repayment</button></div>`:`<div class="mut" style="margin-top:10px">Status: ${esc(r.status)}</div>`}</div>
  <div class="card"><b>Repayments</b>${(r.pay||[]).length?r.pay.map(x=>`<div class="pay"><div><b>${money(x.amt)}</b> <span class="mut">${fdate(x.date)}${x.note?' · '+esc(x.note):''} · by ${x.by==me?'you':esc(oName(r))}</span>${thumbs(pf[x.id])}</div></div>`).join(''):'<div class="mut" style="margin-top:6px">None recorded yet.</div>'}</div>`}

function cSign(create){const em=lc($('#cu_email').value),pw=$('#cu_pass').value,nm=$('#cu_name').value.trim(),a=firebase.auth();cloudMsg='';
  if(!em||!pw){cloudMsg='Enter your email and password.';return render()}
  if(create){if(!nm){cloudMsg='Enter your name so people know who is asking.';return render()}
    a.createUserWithEmailAndPassword(em,pw).then(c=>c.user.updateProfile({displayName:nm}).then(()=>c.user.sendEmailVerification()).then(()=>{CU=a.currentUser;watch();render()})).catch(cerr)}
  else a.signInWithEmailAndPassword(em,pw).catch(cerr)}
function cReset(){const em=lc($('#cu_email').value);if(!em){cloudMsg='Enter your email above first.';return render()}
  firebase.auth().sendPasswordResetEmail(em).then(()=>{cloudMsg='Password reset email sent.';render()}).catch(cerr)}
function readNotes(){const db=firebase.firestore(),b=db.batch();CN.filter(n=>!n.read).forEach(n=>b.update(db.collection('notes').doc(n.id),{read:true}));b.commit().catch(cerr)}
function shareDebt(){if(!CU||!CU.emailVerified)return;
  modal('Share a debt',[{k:'email',l:"Other person's email",t:'email'},{k:'role',l:'You are the',o:['Lender (I gave money)','Borrower (I received money)']},{k:'amt',l:'Amount',t:'number'},{k:'date',l:'Date (optional)',t:'date'},{k:'due',l:'Due date (optional)',t:'date'},{k:'note',l:'Note (optional)'}],v=>{
    const o=lc(v.email),me=lc(CU.email);if(!/^\S+@\S+\.\S+$/.test(o)||o==me||!(+v.amt>0))return false;
    const lender=v.role[0]=='L',rec={emails:[me,o],lender:lender?me:o,borrower:lender?o:me,amt:+v.amt,date:v.date||'',due:v.due||'',note:v.note||'',status:'pending',createdBy:me,pay:[],ts:Date.now()};
    rec[lender?'lenderName':'borrowerName']=myName();
    firebase.firestore().collection('shared').add(rec).then(r=>note(o,myName()+' sent you a debt request of '+money(rec.amt),r.id)).catch(cerr)})}
function respond(id,ok){const r=CS.find(x=>x.id==id);if(!r)return;const me=lc(CU.email),u={status:ok?'accepted':'declined'};u[r.lender==me?'lenderName':'borrowerName']=myName();
  firebase.firestore().collection('shared').doc(id).update(u).then(()=>note(r.createdBy,myName()+(ok?' accepted':' declined')+' your debt request of '+money(r.amt),id)).catch(cerr)}
function cancelShared(id){firebase.firestore().collection('shared').doc(id).delete().catch(cerr)}
function addSharedPay(id){const r=CS.find(x=>x.id==id);if(!r)return;
  modal('Add repayment – screenshot required',[{k:'amt',l:'Amount',t:'number',v:Math.max(r.amt-sPaid(r),0)||''},{k:'date',l:'Date',t:'date',v:today()},{k:'note',l:'Note (optional)'}],(v,sh)=>{
    if(!(+v.amt>0)||!sh.length)return false;
    const shots=sh.slice(0,3);if(shots.join('').length>700000){alert('Screenshots are too large. Add fewer or smaller images.');return false}
    const x={id:uid(),amt:+v.amt,date:v.date||today(),note:v.note||'',by:lc(CU.email),hasProof:true},db=firebase.firestore(),ref=db.collection('shared').doc(id);
    ref.collection('proofs').doc(x.id).set({shots,by:x.by,ts:Date.now()}).then(()=>ref.update({pay:firebase.firestore.FieldValue.arrayUnion(x)})).then(()=>{SP[id]=null;return note(otherOf(r).e,myName()+' recorded a repayment of '+money(x.amt)+' with a screenshot',id)}).catch(cerr)})}
const SP={};
function loadProofs(id){if(SP[id]!==undefined)return;SP[id]={};firebase.firestore().collection('shared').doc(id).collection('proofs').get().then(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data().shots||[]);SP[id]=m;if(view&&view.id==id)render()}).catch(()=>{SP[id]=undefined})}
</script>
